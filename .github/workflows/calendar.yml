name: Update calendar

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calendar tools
        run: pip install icalendar recurring-ical-events

      - name: Build events.json from Outlook
        env:
          ICS_URL: ${{ secrets.OUTLOOK_ICS_URL }}
          SHOW_DETAILS: "true"   # change to "false" to show every event as "Busy"
          DAYS_AHEAD: "14"
          TIMEZONE: "Europe/London"
        run: python scripts/build_events.py

      - name: Save if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --staged --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update calendar"
            git push
          fi
